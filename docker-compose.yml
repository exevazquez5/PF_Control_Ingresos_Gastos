services:
  backend:
    build: ./backend/ExpensesTracker.api
    container_name: backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RunningInDocker=true
      - DOTNET_SYSTEM_NET_DISABLEIPV6=1
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=postgres;Username=postgres;Password=gastar_dev;SSL Mode=Disable;Trust Server Certificate=true
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Email__BrevoApiKey=${Email__BrevoApiKey}
      - Email__SenderEmail=${Email__SenderEmail}
      - Email__SenderName=${Email__SenderName}
      - FrontendUrl=${FrontendUrl}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:17-alpine
    container_name: db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=gastar_dev
      - POSTGRES_DB=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    build:
      context: ./frontend
    container_name: nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata_dev:
